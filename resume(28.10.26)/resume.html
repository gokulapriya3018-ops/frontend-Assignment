<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gokula Priya K - Full Stack Developer | Resume</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #333333;
            background-color: #f4f6f8;
            padding: 24px 16px;
        }

        .resume-container {
            max-width: 820px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 28px 32px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .resume-header {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #2563eb;
        }

        .avatar-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2563eb;
            flex-shrink: 0;
        }

        .header-info {
            flex: 1;
        }

        .candidate-name {
            font-size: 24px;
            font-weight: 700;
            color: #1e3a8a;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .candidate-role {
            font-size: 15px;
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .contact-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
        }

        .contact-item {
            font-size: 13px;
            color: #4b5563;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .contact-item a {
            color: #2563eb;
            text-decoration: none;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        .section {
            margin-bottom: 22px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e3a8a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-bottom: 6px;
            margin-bottom: 12px;
            border-bottom: 1px solid #dbeafe;
        }

        .section-text {
            font-size: 13.5px;
            color: #4b5563;
            line-height: 1.6;
            text-align: justify;
        }

        .skills-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .skill-category-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-size: 13.5px;
        }

        .skill-category-title {
            font-weight: 700;
            color: #1f2937;
            min-width: 90px;
        }

        .skill-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .skill-tag {
            background-color: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12.5px;
            font-weight: 500;
        }

        .entry-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-left: 3px solid #2563eb;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }

        .entry-title {
            font-size: 15px;
            font-weight: 700;
            color: #1f2937;
        }

        .entry-date {
            font-size: 12.5px;
            font-weight: 600;
            color: #64748b;
        }

        .entry-subtitle {
            font-size: 13px;
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 6px;
        }

        .entry-desc {
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .entry-bullets {
            padding-left: 18px;
            margin-top: 6px;
        }

        .entry-bullets li {
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .tech-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .tech-tag {
            font-size: 11.5px;
            font-weight: 600;
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            border-radius: 3px;
            padding: 2px 6px;
        }

        .badge-tag {
            display: inline-block;
            font-size: 11.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .badge-gold {
            background-color: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        .badge-bronze {
            background-color: #ffedd5;
            color: #9a3412;
            border: 1px solid #fed7aa;
        }

        .edu-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
            font-size: 13px;
        }

        .edu-table th,
        .edu-table td {
            padding: 10px 12px;
            text-align: left;
            border: 1px solid #e5e7eb;
        }

        .edu-table th {
            background-color: #f8fafc;
            color: #1e3a8a;
            font-weight: 700;
            font-size: 13px;
        }

        .edu-table tr:nth-child(even) {
            background-color: #fcfdfe;
        }

        .edu-degree {
            font-weight: 600;
            color: #1f2937;
        }

        .edu-col {
            color: #4b5563;
        }

        .edu-duration {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
        }

        @media (max-width: 650px) {
            .resume-container {
                padding: 18px 16px;
            }

            .resume-header {
                flex-direction: column;
                text-align: center;
                gap: 14px;
            }

            .contact-links {
                justify-content: center;
            }

            .skill-category-row {
                flex-direction: column;
                gap: 4px;
            }

            .edu-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    <div class="resume-container" id="root"></div>

    <script>
        const candidateInfo = {
            name: "GOKULA PRIYA K",
            role: "Full Stack Developer",
            email: "gokulapriya3018@gmail.com",
            phone: "+91 Chennai, India",
            linkedin: "https://www.linkedin.com/in/gokula-priya-80a378374/",
            portfolio: "https://gokulapriya3018-ops.github.io/Personal-Portfolio/",
            github: "https://github.com/gokulapriya3018-ops",
            summary: "Passionate Full Stack Developer with hands-on expertise across modern React.js, Node.js, Express.js, and MongoDB/MySQL environments. Skilled in engineering responsive interfaces, designing robust RESTful APIs, and solving competitive problems in hackathons. Fast learner committed to delivering scalable, high-performance web applications."
        };
        const skillsByCategory = {
            "Frontend": ["React.js", "JavaScript (ES6+)", "TypeScript", "HTML5", "CSS3", "Tailwind CSS", "Redux Toolkit"],
            "Backend": ["Node.js", "Express.js", "REST APIs"],
            "Database": ["MongoDB", "MySQL"],
            "Tools": ["Git & GitHub", "Postman", "Docker Basics"]
        };
        const experienceList = [
            {
                role: "Full Stack Developer Intern",
                company: "NOVITECH VIRTUAL",
                location: "Chennai, India",
                duration: "Nov 2024 – Jan 2025",
                points: [
                    "Engineered dynamic web components and responsive layouts using HTML5, CSS3, JavaScript, and React.js.",
                    "Developed backend RESTful APIs and optimized route controllers using Node.js and Express.",
                    "Designed database schemas, handled queries, and ensured data integrity utilizing MongoDB and MySQL.",
                    "Collaborated in sprint cycles, daily debugging sessions, and code refactoring workflows."
                ]
            },
            {
                role: "Data Analytics Intern",
                company: "BLUESTOCK FINTECH",
                location: "Remote",
                duration: "May 2024 – Jul 2024",
                points: [
                    "Analyzed financial datasets and equity market trends to extract strategic analytical insights.",
                    "Cleaned unstructured data and created automated visualization charts and reports using Excel and Python.",
                    "Assisted analytical teams in document management and market trend synthesis."
                ]
            }
        ];
        const projectList = [
            {
                title: "Project Hub – Task Management Admin Dashboard",
                tech: ["React.js", "TypeScript", "Tailwind CSS"],
                desc: "Developed a responsive admin dashboard with role-based authentication, full CRUD task management, interactive analytics charts, and search filtering."
            },
            {
                title: "Cybersecurity Interactive Learning Platform",
                tech: ["HTML5", "CSS3", "JavaScript", "React", "Docker"],
                desc: "Built an educational lab platform featuring interactive cybersecurity quizzes and containerized environments for practical hands-on security training."
            },
        ];
        const certificationsList = [
            {
                title: "Anna Violet College Hackathon",
                badge: "1st Place Winner",
                theme: "badge-gold",
                organization: "Anna Violet Arts & Science College"
            },
            {
                title: "SA Engineering College Hackathon",
                badge: "3rd Place Winner",
                theme: "badge-bronze",
                organization: "SA Engineering College"
            }
        ];

        const educationList = [
            {
                degree: "Master of Computer Application (MCA)",
                college: "SA Engineering College, Chennai",
                duration: "Aug 2025 – May 2027",
                detail: "Pursuing 1st year with focus on Full Stack Development, Cloud Architectures, and Database Management Systems."
            },
            {
                degree: "Bachelor of Computer Application (BCA)",
                college: "University of Madras | BMC College",
                duration: "Aug 2022 – May 2025",
                detail: "Graduated with 8.5 CGPA. Served as Technical Coordinator organizing inter-college hackathons and code challenges."
            }
        ];
        const renderResume = () => {
            const root = document.getElementById("root");
            if (!root) return;
            const skillsHTML = Object.entries(skillsByCategory).map(([category, skills]) => `
                <div class="skill-category-row">
                    <span class="skill-category-title">${category}:</span>
                    <div class="skill-pills">
                        ${skills.map(s => `<span class="skill-tag">${s}</span>`).join("")}
                    </div>
                </div>
            `).join("");
            const expHTML = experienceList.map(exp => `
                <div class="entry-card">
                    <div class="entry-header">
                        <span class="entry-title">${exp.role}</span>
                        <span class="entry-date">${exp.duration}</span>
                    </div>
                    <div class="entry-subtitle"> ${exp.company} • ${exp.location}</div>
                    <ul class="entry-bullets">
                        ${exp.points.map(pt => `<li>${pt}</li>`).join("")}
                    </ul>
                </div>
            `).join("");
            const projectsHTML = projectList.map(proj => `
                <div class="entry-card">
                    <div class="entry-header">
                        <span class="entry-title">${proj.title}</span>
                    </div>
                    <p class="entry-desc">${proj.desc}</p>
                    <div class="tech-pills">
                        ${proj.tech.map(t => `<span class="tech-tag">${t}</span>`).join("")}
                    </div>
                </div>
            `).join("");
            const hackathonsHTML = certificationsList.map(cert => `
                <div class="entry-card">
                    <div class="entry-header">
                        <span class="entry-title">${cert.title}</span>
                        <span class="badge-tag ${cert.theme}">${cert.badge}</span>
                    </div>
                    <div class="entry-subtitle">${cert.organization}</div>
                </div>
            `).join("");
            const eduRows = educationList.map(edu => `
                <tr>
                    <td style="width: 28%;"><span class="edu-degree">${edu.degree}</span></td>
                    <td style="width: 27%;"><span class="edu-col"> ${edu.college}</span></td>
                    <td style="width: 17%;"><span class="edu-duration">${edu.duration}</span></td>
                    <td style="width: 28%;">${edu.detail}</td>
                </tr>
            `).join("");
            root.innerHTML = `
                <!-- Header -->
                <header class="resume-header">
                    <div class="header-info">
                        <h1 class="candidate-name">${candidateInfo.name}</h1>
                        <div class="candidate-role">${candidateInfo.role}</div>
                        <div class="contact-links">
                            <span class="contact-item"> <a href="mailto:${candidateInfo.email}">${candidateInfo.email}</a></span>
                            <span class="contact-item"> ${candidateInfo.phone}</span>
                            <span class="contact-item"> <a href="${candidateInfo.linkedin}" target="_blank">LinkedIn</a></span>
                            <span class="contact-item"> <a href="${candidateInfo.portfolio}" target="_blank">Portfolio</a></span>
                            <span class="contact-item"> <a href="${candidateInfo.github}" target="_blank">GitHub</a></span>
                        </div>
                    </div>
                </header>

                <!-- Professional Summary -->
                <section class="section">
                    <h2 class="section-title">Professional Summary</h2>
                    <p class="section-text">${candidateInfo.summary}</p>
                </section>

                <!-- Technical Skills -->
                <section class="section">
                    <h2 class="section-title">Technical Skills</h2>
                    <div class="skills-list">
                        ${skillsHTML}
                    </div>
                </section>

                <!-- Work Experience -->
                <section class="section">
                    <h2 class="section-title">Work Experience</h2>
                    ${expHTML}
                </section>

                <!-- Featured Projects -->
                <section class="section">
                    <h2 class="section-title">Featured Projects</h2>
                    ${projectsHTML}
                </section>

                <!-- Hackathons & Achievements -->
                <section class="section">
                    <h2 class="section-title">Hackathons & Achievements</h2>
                    ${hackathonsHTML}
                </section>

                <!-- Education -->
                <section class="section">
                    <h2 class="section-title">Education</h2>
                    <table class="edu-table">
                        <thead>
                            <tr>
                                <th>Degree</th>
                                <th>Institution</th>
                                <th>Duration</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${eduRows}
                        </tbody>
                    </table>
                </section>
            `;
        };

        renderResume();
    </script>
</body>

</html>
