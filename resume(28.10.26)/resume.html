<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gokula Priya K - Resume</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            line-height: 1.6;
            padding: 30px 15px;
        }

        .resume-container {
            max-width: 820px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 35px 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #0f172a;
            font-size: 26px;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .header p {
            color: #2563eb;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 14px;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            font-size: 16px;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #2563eb;
            display: inline-block;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }

        .section p {
            font-size: 14.5px;
            color: #475569;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
            padding: 0;
            margin-top: 5px;
        }

        .skill-item {
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13.5px;
            font-weight: 500;
        }

        .card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #2563eb;
            border-radius: 6px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 15px;
            color: #0f172a;
        }

        .card-sub {
            color: #64748b;
            font-size: 13.5px;
            margin: 4px 0 8px 0;
        }

        .details-list {
            padding-left: 20px;
            margin: 0;
        }

        .details-list li {
            font-size: 14px;
            color: #475569;
            margin-bottom: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }

        th {
            background-color: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 10px;
            text-align: left;
            font-weight: 600;
        }

        td {
            border: 1px solid #cbd5e1;
            padding: 10px;
            color: #475569;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .slideshow-box {
            position: relative;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #2563eb;
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            min-height: 150px;
        }

        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .slide-title {
            font-size: 15.5px;
            font-weight: 700;
            color: #1e3a8a;
        }

        .slide-counter {
            font-size: 12px;
            font-weight: 600;
            background: #eff6ff;
            color: #1d4ed8;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid #bfdbfe;
        }

        .slide-tech {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .tech-tag {
            background: #f1f5f9;
            color: #475569;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .slide-desc {
            font-size: 14px;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .slide-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 12px;
        }

        .slide-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .slide-btn:hover {
            background: #1d4ed8;
        }

        .slide-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
        }

        .dot.active {
            background: #2563eb;
            transform: scale(1.25);
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script>
        const candidateInfo = {
            name: "GOKULA PRIYA K",
            role: "Full Stack Developer",
            email: "gokulapriya3018@gmail.com",
            linkedin: "https://www.linkedin.com/in/gokula-priya-80a378374/",
            portfolio: "https://gokulapriya3018-ops.github.io/Personal-Portfolio/",
            summary: "Passionate Full Stack Developer with practical experience in React.js, Node.js, Express.js, and MongoDB. Skilled in building clean user interfaces, connecting REST APIs, and database handling. Quick learner eager to contribute to real-world software projects."
        };
        const allSkills = [
            { name: "React.js", category: "frontend" }, { name: "JavaScript", category: "frontend" },
            { name: "TypeScript", category: "frontend" }, { name: "HTML5", category: "frontend" },
            { name: "CSS3", category: "frontend" }, { name: "Tailwind CSS", category: "frontend" },
            { name: "Node.js", category: "backend" }, { name: "Express.js", category: "backend" },
            { name: "MongoDB", category: "database" }, { name: "MySQL", category: "database" },
            { name: "Git & GitHub", category: "tools" }, { name: "Postman", category: "tools" }
        ];
        const experienceList = [
            {
                role: "Full Stack Developer Intern",
                company: "NOVITECH VIRTUAL",
                location: "Chennai",
                duration: "Nov 2024 – Jan 2025",
                points: [
                    "Built dynamic web pages and responsive layouts using HTML, CSS, JavaScript, and React.",
                    "Developed backend REST APIs and handled routing using Node.js and Express.",
                    "Managed database queries and schemas with MongoDB and MySQL.",
                    "Participated in daily debugging, testing, and team project discussions."
                ]
            },
            {
                role: "Data Analytics Intern",
                company: "BLUESTOCK FINTECH",
                location: "Remote",
                duration: "May 2024 – Jul 2024",
                points: [
                    "Analyzed financial datasets and stock market information to track trends.",
                    "Cleaned raw data and created visual summary charts and reports using Excel and Python.",
                    "Supported the analytical team with research and data documentation."
                ]
            }
        ];
        const educationList = [
            {
                degree: "Master of Computer Application (MCA)",
                college: "SA Engineering College, Chennai",
                duration: "Aug 2025 – May 2027",
                detail: "Pursuing 1st year with focus on Full Stack Development and Database Management."
            },
            {
                degree: "Bachelor of Computer Application (BCA)",
                college: "University of Madras | BMC College",
                duration: "Aug 2022 – May 2025",
                detail: "Graduated with 8.5 CGPA. Served as Technical Coordinator in student association."
            }
        ];
        const divContainer = document.getElementById("root")
        const getResumeHTML = () => {
            const frontendSkills = allSkills.filter((item) => {
                return item.category === "frontend";
            });
            const skillsHTML = frontendSkills.map((item) => {
                return `<li class="skill-item">${item.name}</li>`;
            }).join("");
            const expHTML = experienceList.map((exp) => {
                const pointsList = exp.points.map((pt) => `<li>${pt}</li>`).join("");
                return `
                    <div class="card">
                        <div class="card-header">
                            <span>${exp.role} - ${exp.company}</span>
                            <span>${exp.duration}</span>
                        </div>
                        <div class="card-sub">${exp.location}</div>
                        <ul class="details-list">
                            ${pointsList}
                        </ul>
                    </div>
                `;
            }).join("");
            const eduRows = educationList.map((edu) => {
                return `
                    <tr>
                        <td style="border: 1px solid #ccc; padding: 8px;">${edu.degree}</td>
                        <td style="border: 1px solid #ccc; padding: 8px;">${edu.college}</td>
                        <td style="border: 1px solid #ccc; padding: 8px;">${edu.duration}</td>
                        <td style="border: 1px solid #ccc; padding: 8px;">${edu.detail}</td>
                    </tr>
                `;
            }).join("");

            const eduHTML = `
                <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                    <thead>
                        <tr style="background-color: #f2f2f2; text-align: left;">
                            <th style="border: 1px solid #ccc; padding: 8px;">Degree</th>
                            <th style="border: 1px solid #ccc; padding: 8px;">College</th>
                            <th style="border: 1px solid #ccc; padding: 8px;">Duration</th>
                            <th style="border: 1px solid #ccc; padding: 8px;">Detail</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${eduRows}
                    </tbody>
                </table>
            `;
            return `
                <div class="resume-container">
                    <div class="header" style="text-align: center;">
                        <h1>${candidateInfo.name}</h1>
                        <p style="color: #2563eb; font-weight: bold; margin-bottom: 5px;">${candidateInfo.role}</p>
                        <div class="links">
                            <span>${candidateInfo.email}</span>
                            <span> <a href="${candidateInfo.linkedin}" target="_blank">LinkedIn</a></span>
                            <span> <a href="${candidateInfo.portfolio}" target="_blank">Portfolio</a></span>
                        </div>
                    </div>

                    <div class="section">
                        <h2>SUMMARY</h2>
                        <p>${candidateInfo.summary}</p>
                    </div>

                    <div class="section">
                        <h2>FRONTEND SKILLS</h2>
                        <ul class="skills-list">
                            ${skillsHTML}
                        </ul>
                    </div>

                    <div class="section">
                        <h2>EXPERIENCE</h2>
                        ${expHTML}
                    </div>

                    <div class="section">
                        <h2>FEATURED PROJECTS</h2>
                        <div id="slideshow-content" class="slideshow-box"></div>
                    </div>

                    <div class="section">
                        <h2>EDUCATION</h2>
                        ${eduHTML}
                    </div>
                </div>
            `;
        };
        divContainer.innerHTML = getResumeHTML() ?? "";

        // Slideshow Data & Interactive Logic
        const projectList = [
            {
                title: "Project Hub – Task Management Admin Dashboard",
                tech: ["React.js", "TypeScript", "Tailwind CSS", "Redux Toolkit"],
                desc: "Developed a responsive admin dashboard with role-based authentication, full CRUD task management, and interactive analytics charts."
            },
            {
                title: "Cybersecurity Interactive Learning Platform",
                tech: ["HTML5", "CSS3", "JavaScript", "Docker"],
                desc: "Built an educational lab platform featuring interactive cybersecurity quizzes and containerized environments for practical training."
            },
            {
                title: "Online Shopping E-Commerce Website",
                tech: ["JavaScript", "HTML5", "CSS3", "Local Storage"],
                desc: "Created a storefront application featuring instant product filtering, shopping cart state management, and persistent local storage."
            }
        ];

        let currentSlide = 0;

        function updateSlideUI() {
            const slide = projectList[currentSlide];
            const techHTML = slide.tech.map((t) => `<span class="tech-tag">${t}</span>`).join("");
            const dotsHTML = projectList.map((_, i) => `
                <span class="dot ${i === currentSlide ? 'active' : ''}" onclick="goToSlide(${i})"></span>
            `).join("");

            const container = document.getElementById("slideshow-content");
            if (!container) return;

            container.innerHTML = `
                <div class="slide-header">
                    <span class="slide-title">${slide.title}</span>
                    <span class="slide-counter">${currentSlide + 1} of ${projectList.length}</span>
                </div>
                <div class="slide-tech">${techHTML}</div>
                <p class="slide-desc">${slide.desc}</p>
                <div class="slide-controls">
                    <button class="slide-btn" onclick="prevSlide()">❮ Prev</button>
                    <div class="slide-dots">${dotsHTML}</div>
                    <button class="slide-btn" onclick="nextSlide()">Next ❯</button>
                </div>
            `;
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % projectList.length;
            updateSlideUI();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + projectList.length) % projectList.length;
            updateSlideUI();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlideUI();
        }

        // Initialize slideshow
        updateSlideUI();
    </script>
</body>

</html>
